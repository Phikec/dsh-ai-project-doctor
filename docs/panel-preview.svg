  <circle cx="676" cy="186" r="4" fill="#CBD2DE"/>
  <rect x="686" y="183" width="18" height="6" rx="3" fill="#E1E4EC"/>
  <rect x="596" y="204" width="188" height="6" rx="3" fill="#EFF1F6"/>

