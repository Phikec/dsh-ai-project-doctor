  <path d="M529.5 315l2.6 2.8 5-5.4" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="550" y="310" width="104" height="7" rx="3.5" fill="#DDE1EA"/>
  <rect x="550" y="320" width="166" height="5" rx="2.5" fill="#EFF1F6"/>

