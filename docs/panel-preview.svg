<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The AI Project Doctor panel beside a conversation</title>
  <desc id="desc">An illustration of the DeepSeek Harness window: a conversation on the left and the Doctor panel on the right with a health ring, counters, suggested fixes, and findings.</desc>

